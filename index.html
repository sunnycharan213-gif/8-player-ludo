<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8 Player Ludo</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    margin: 5px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

input {
    padding: 12px;
    border: none;
    border-radius: 10px;
    text-align: center;
    font-size: 16px;
}

#gameScreen {
    display: none;
}

.room-box,
.status {
    width: min(95%, 600px);
    margin: 10px auto;
    padding: 12px;
    background: #1f2937;
    border-radius: 15px;
}

#board {
    width: min(96vw, 650px);
    height: min(96vw, 650px);
    margin: 12px auto;
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    border: 4px solid black;
    background: white;
}

/* BASIC CELLS */

.cell {
    position: relative;
    border: 1px solid #777;
    background: white;
}

/* 8 PLAYER HOME AREAS */

.home1 { background: #ef4444; }
.home2 { background: #3b82f6; }
.home3 { background: #22c55e; }
.home4 { background: #f59e0b; }

.home5 { background: #a855f7; }
.home6 { background: #ec4899; }
.home7 { background: #06b6d4; }
.home8 { background: #84cc16; }

/* HOME CENTER */

.homeCenter {
    position: absolute;
    width: 55%;
    height: 55%;
    left: 22.5%;
    top: 22.5%;
    background: white;
    border-radius: 10px;
}

/* PATH */

.path {
    background: white;
}

.safe {
    background: #e5e7eb;
}

/* CENTER */

.center {
    background: white;
}

.center1 { background: #ef4444; }
.center2 { background: #3b82f6; }
.center3 { background: #22c55e; }
.center4 { background: #f59e0b; }
.center5 { background: #a855f7; }
.center6 { background: #ec4899; }
.center7 { background: #06b6d4; }
.center8 { background: #84cc16; }

/* PAWNS */

.pawn {
    position: absolute;
    width: 75%;
    height: 75%;
    left: 12.5%;
    top: 12.5%;
    border-radius: 50%;
    border: 2px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 7px;
    font-weight: bold;
    z-index: 5;
}

.p1 { background:#dc2626; }
.p2 { background:#2563eb; }
.p3 { background:#16a34a; }
.p4 { background:#d97706; }
.p5 { background:#9333ea; }
.p6 { background:#db2777; }
.p7 { background:#0891b2; }
.p8 { background:#65a30d; }

#dice {
    font-size: 55px;
    margin: 8px;
}

#rollButton {
    background: #22c55e;
    color: white;
}

.player-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
}

.player {
    padding: 6px 10px;
    border-radius: 8px;
    background: #374151;
}

.current {
    outline: 3px solid white;
}

@media(max-width:500px) {
    #board {
        width: 97vw;
        height: 97vw;
        border-width: 3px;
    }

    .pawn {
        font-size: 5px;
    }
}
</style>
</head>

<body>

<h1>🎲 8 PLAYER LUDO</h1>

<div id="roomScreen">

    <div class="room-box">

        <h2>🏠 Create Room</h2>

        <button onclick="createRoom()">
            CREATE ROOM
        </button>

        <hr>

        <h2>🚀 Join Room</h2>

        <input
            id="roomInput"
            placeholder="Room Code"
            maxlength="5"
        >

        <br>

        <button onclick="joinRoom()">
            JOIN ROOM
        </button>

        <p id="roomMessage"></p>

    </div>

</div>


<div id="gameScreen">

    <div class="status">

        Room:
        <b id="gameRoomCode">---</b>

        <br>

        Players:
        <b id="playerCount">0</b>/8

        <br>

        You:
        <b id="myPlayer">---</b>

    </div>


    <div
        class="player-list"
        id="playerList">
    </div>


    <div class="status">

        <b id="turnText">
            Waiting...
        </b>

    </div>


    <div id="board"></div>


    <div>

        <div id="dice">🎲</div>

        <button
            id="rollButton"
            onclick="rollDice()">

            🎲 ROLL DICE

        </button>

    </div>


    <div id="message"></div>

</div>


<script>

const socket = io();

let myPlayerNumber = null;
let roomCode = null;
let currentPlayer = 1;
let diceValue = null;
let gamePawns = {};
let winners = [];


const roomScreen =
    document.getElementById("roomScreen");

const gameScreen =
    document.getElementById("gameScreen");

const roomInput =
    document.getElementById("roomInput");

const roomMessage =
    document.getElementById("roomMessage");

const board =
    document.getElementById("board");

const playerCount =
    document.getElementById("playerCount");

const myPlayer =
    document.getElementById("myPlayer");

const gameRoomCode =
    document.getElementById("gameRoomCode");

const turnText =
    document.getElementById("turnText");

const dice =
    document.getElementById("dice");

const rollButton =
    document.getElementById("rollButton");

const message =
    document.getElementById("message");


/* =========================
   ROOM
========================= */

function createRoom() {

    roomMessage.innerText =
        "Creating room...";

    socket.emit("createRoom");
}


function joinRoom() {

    const code =
        roomInput.value.trim().toUpperCase();

    if (!code) {

        roomMessage.innerText =
            "Enter Room Code.";

        return;
    }

    roomMessage.innerText =
        "Joining...";

    socket.emit(
        "joinRoom",
        { roomCode: code }
    );
}


socket.on("roomCreated", data => {

    roomCode =
        data.roomCode;

    gameRoomCode.innerText =
        roomCode;

    showGame();

});


socket.on("roomJoined", data => {

    roomCode =
        data.roomCode;

    gameRoomCode.innerText =
        roomCode;

    showGame();

    setMessage(
        "Joined room!"
    );

});


socket.on("playerJoined", data => {

    myPlayerNumber =
        data.playerNumber;

    myPlayer.innerText =
        "Player " +
        myPlayerNumber;

});


socket.on("playersUpdate", data => {

    playerCount.innerText =
        data.count;

    updatePlayerList(
        data.count
    );

});


/* =========================
   GAME STATE
========================= */

socket.on("gameState", data => {

    currentPlayer =
        data.currentPlayer;

    diceValue =
        data.dice;

    gamePawns =
        data.pawns || {};

    winners =
        data.winners || [];

    renderBoard();

    updateTurn();

    updateDice();

});


socket.on("turnChanged", data => {

    currentPlayer =
        data.currentPlayer;

    diceValue = null;

    updateTurn();

    updateDice();

});


socket.on("diceRolled", data => {

    diceValue =
        data.dice;

    updateDice();

});


socket.on("pawnMoved", data => {

    if (!gamePawns[data.player]) {

        gamePawns[data.player] =
            [0,0,0,0];

    }

    gamePawns[data.player]
        [data.pawnIndex] =
        data.position;

    diceValue = null;

    renderBoard();

    updateDice();

});


socket.on("captureMessage", data => {

    setMessage(
        "💥 Player " +
        data.player +
        " captured!"
    );

    renderBoard();

});


socket.on("pawnFinished", data => {

    setMessage(
        "🏁 Player " +
        data.player +
        " finished a pawn!"
    );

});


socket.on("playerWon", data => {

    winners =
        data.winners || [];

    setMessage(
        "🏆 Player " +
        data.player +
        " WON!"
    );

});


socket.on("moveRejected", data => {

    setMessage(
        "⚠️ " +
        data.message
    );

});


socket.on("roomError", data => {

    roomMessage.innerText =
        "❌ " +
        data.message;

});


/* =========================
   DICE
========================= */

function rollDice() {

    if (
        myPlayerNumber !==
        currentPlayer
    ) {

        setMessage(
            "Wait for your turn."
        );

        return;
    }

    if (diceValue !== null) {

        setMessage(
            "Move your pawn first."
        );

        return;
    }

    socket.emit("rollDice");

}


/* =========================
   MOVE
========================= */

function movePawn(index) {

    if (
        myPlayerNumber !==
        currentPlayer
    ) {

        setMessage(
            "Wait for your turn."
        );

        return;
    }

    if (diceValue === null) {

        setMessage(
            "Roll dice first."
        );

        return;
    }

    socket.emit(
        "movePawn",
        {
            pawnIndex:index
        }
    );

}


/* =========================
   SHOW GAME
========================= */

function showGame() {

    roomScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";

    renderBoard();

}


/* =========================
   MESSAGE
========================= */

function setMessage(text) {

    message.innerText =
        text;

}


/* =========================
   TURN
========================= */

function updateTurn() {

    if (
        currentPlayer ===
        myPlayerNumber
    ) {

        turnText.innerText =
            "🟢 YOUR TURN";

    } else {

        turnText.innerText =
            "Player " +
            currentPlayer +
            "'s TURN";

    }

}


/* =========================
   DICE DISPLAY
========================= */

function updateDice() {

    const faces = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];

    if (
        diceValue >= 1 &&
        diceValue <= 6
    ) {

        dice.innerText =
            faces[diceValue - 1];

    } else {

        dice.innerText =
            "🎲";

    }


    rollButton.disabled =
        !(
            myPlayerNumber ===
            currentPlayer &&
            diceValue === null
        );

}


/* =========================
   PLAYER LIST
========================= */

function updatePlayerList(count) {

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML = "";

    for (
        let i = 1;
        i <= count;
        i++
    ) {

        const p =
            document.createElement(
                "div"
            );

        p.className =
            "player";

        if (
            i === currentPlayer
        ) {

            p.classList.add(
                "current"
            );

        }

        p.innerText =
            "P" + i;

        list.appendChild(p);

    }

}


/* =========================
   8 PLAYER BOARD
========================= */

function createBoard() {

    board.innerHTML = "";


    for (
        let row = 0;
        row < 15;
        row++
    ) {

        for (
            let col = 0;
            col < 15;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );

            cell.className =
                "cell";


            /*
              8 HOME AREAS
            */

            if (
                row <= 3 &&
                col <= 3
            ) {

                cell.classList.add(
                    "home1"
                );

            }

            else if (
                row <= 3 &&
                col >= 6 &&
                col <= 8
            ) {

                cell.classList.add(
                    "home2"
                );

            }

            else if (
                row <= 3 &&
                col >= 11
            ) {

                cell.classList.add(
                    "home3"
                );

            }

            else if (
                row >= 6 &&
                row <= 8 &&
                col <= 3
            ) {

                cell.classList.add(
                    "home4"
                );

            }

            else if (
                row >= 6 &&
                row <= 8 &&
                col >= 11
            ) {

                cell.classList.add(
                    "home5"
                );

            }

            else if (
                row >= 11 &&
                col <= 3
            ) {

                cell.classList.add(
                    "home6"
                );

            }

            else if (
                row >= 11 &&
                col >= 6 &&
                col <= 8
            ) {

                cell.classList.add(
                    "home7"
                );

            }

            else if (
                row >= 11 &&
                col >= 11
            ) {

                cell.classList.add(
                    "home8"
                );

            }

            else {

                cell.classList.add(
                    "path"
                );

            }


            /*
              CENTER
            */

            if (
                row >= 6 &&
                row <= 8 &&
                col >= 6 &&
                col <= 8
            ) {

                cell.className =
                    "cell center";

            }


            cell.dataset.row =
                row;

            cell.dataset.col =
                col;

            board.appendChild(
                cell
            );

        }

    }

}


/* =========================
   PATH
========================= */

function createPath() {

    const path = [];

    /*
      Outer square path
    */

    for (
        let col = 0;
        col < 15;
        col++
    ) {

        path.push({
            row:7,
            col:col
        });

    }


    for (
        let row = 6;
        row >= 0;
        row--
    ) {

        path.push({
            row:row,
            col:7
        });

    }


    for (
        let col = 8;
        col < 15;
        col++
    ) {

        path.push({
            row:0,
            col:col
        });

    }


    for (
        let row = 1;
        row < 15;
        row++
    ) {

        path.push({
            row:row,
            col:14
        });

    }


    for (
        let col = 13;
        col >= 0;
        col--
    ) {

        path.push({
            row:14,
            col:col
        });

    }


    for (
        let row = 13;
        row >= 8;
        row--
    ) {

        path.push({
            row:row,
            col:0
        });

    }


    return path;

}


/* =========================
   RENDER PAWNS
========================= */

function renderBoard() {

    createBoard();

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    const path =
        createPath();


    for (
        let player = 1;
        player <= 8;
        player++
    ) {

        const pawns =
            gamePawns[player] ||
            [0,0,0,0];


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const position =
                Number(
                    pawns[i]
                );

            if (
                position <= 0
            ) {

                continue;

            }


            const spot =
                path[
                    (position - 1) %
                    path.length
                ];


            const cell =
                getCell(
                    cells,
                    spot.row,
                    spot.col
                );


            if (!cell) {

                continue;

            }


            const pawn =
                document.createElement(
                    "div"
                );

            pawn.className =
                "pawn p" +
                player;

            pawn.innerText =
                "P" +
                player +
                "-" +
                (i + 1);


            if (
                player ===
                myPlayerNumber
            ) {

                pawn.onclick =
                    () => movePawn(i);

            }


            cell.appendChild(
                pawn
            );

        }

    }

}


/* =========================
   GET CELL
========================= */

function getCell(
    cells,
    row,
    col
) {

    for (
        const cell of cells
    ) {

        if (
            Number(
                cell.dataset.row
            ) === row &&
            Number(
                cell.dataset.col
            ) === col
        ) {

            return cell;

        }

    }

    return null;

}


/* =========================
   START BOARD
========================= */

createBoard();

</script>

</body>
</html>
